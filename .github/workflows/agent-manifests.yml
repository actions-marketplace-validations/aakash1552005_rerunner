name: Agent Manifests & MCP Smoke Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: agent-manifests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  agent-manifests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "pyproject.toml"

      - name: Install rerunner package
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Validate agent plugin manifests and skills
        run: |
          python - <<'PY'
          import json
          import tomllib
          from pathlib import Path

          pyproject = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))
          pkg_version = pyproject["project"]["version"]

          manifest_paths = [
              Path("server.json"),
              Path(".claude-plugin/marketplace.json"),
              Path(".claude-plugin/plugin.json"),
              Path(".codex-plugin/plugin.json"),
              Path(".codex-plugin/mcp.json"),
          ]
          for path in manifest_paths:
              assert path.exists(), f"Missing manifest: {path}"
              data = json.loads(path.read_text(encoding="utf-8"))
              assert isinstance(data, dict), f"Manifest must be JSON object: {path}"

          server = json.loads(Path("server.json").read_text(encoding="utf-8"))
          assert server["version"] == pkg_version, "server.json version mismatch"
          assert server["packages"][0]["version"] == pkg_version

          claude_plugin = json.loads(Path(".claude-plugin/plugin.json").read_text(encoding="utf-8"))
          assert claude_plugin["version"] == pkg_version

          codex_plugin = json.loads(Path(".codex-plugin/plugin.json").read_text(encoding="utf-8"))
          assert codex_plugin["version"] == pkg_version

          skill_file = Path("skills/rerunner/SKILL.md")
          assert skill_file.exists() and len(skill_file.read_text(encoding="utf-8").strip()) > 100
          print("All agent manifests and skill definitions validated.")
          PY

      - name: Smoke test rerunner mcp stdio server
        run: |
          python - <<'PY'
          import json
          import subprocess
          import sys

          payload = "\n".join([
              json.dumps({
                  "jsonrpc": "2.0",
                  "id": 1,
                  "method": "initialize",
                  "params": {
                      "protocolVersion": "2025-03-26",
                      "capabilities": {},
                      "clientInfo": {"name": "ci-smoke", "version": "1.0.0"},
                  },
              }),
              json.dumps({"jsonrpc": "2.0", "method": "notifications/initialized"}),
              json.dumps({"jsonrpc": "2.0", "id": 2, "method": "tools/list", "params": {}}),
          ]) + "\n"

          proc = subprocess.run(
              [sys.executable, "-m", "rerunner.cli", "mcp"],
              input=payload,
              text=True,
              capture_output=True,
              timeout=15,
              check=True,
          )
          lines = [line for line in proc.stdout.splitlines() if line.strip()]
          assert len(lines) == 2, f"Expected 2 responses, got {lines!r} stderr={proc.stderr!r}"
          init_resp = json.loads(lines[0])
          tools_resp = json.loads(lines[1])
          assert init_resp["result"]["serverInfo"]["name"] == "rerunner"
          tool_names = [t["name"] for t in tools_resp["result"]["tools"]]
          assert len(tool_names) == 8, f"Unexpected tools: {tool_names}"
          print("MCP stdio smoke check passed with tools:", tool_names)
          PY

