name: Nightly Mutation Testing

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mutation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mutmut:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "pyproject.toml"

      - name: Install dependencies and mutmut
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" mutmut

      - name: Run mutmut on security & integrity primitives
        run: |
          mutmut run \
            --paths-to-mutate=src/rerunner/integrity.py \
            --paths-to-mutate=src/rerunner/sanitizer.py \
            --runner="pytest -q tests/test_integrity.py tests/test_sanitizer.py" || true
          mutmut results

